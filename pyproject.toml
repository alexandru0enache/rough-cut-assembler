[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rough-cut-assembler"
version = "0.1.0"
description = "Automated rough-cut assembler for the DBYPE Dragon Ball videos: VO + script -> timed edit blueprint + motion graphics + Remotion rough cut. Package/command: `assembler` (was `gfxorch`)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Rough-cut assembler: transcribe the VO + align it to the script.
# See docs/plans/video-assembler/. faster-whisper bundles its own ffmpeg (PyAV).
roughcut = [
    "faster-whisper>=1.0",
    "static-ffmpeg>=2.5",
    "opentimelineio>=0.18",          # Phase 5: emit .otio / FCPXML / EDL for the edit
    "otio-fcpx-xml-adapter>=1.0",
    "otio-cmx3600-adapter>=1.0",
]
# Local research corpus: Fandom XML dump -> SQLite FTS5 (assembler wiki build/query).
research = [
    "mwxml>=0.3",
    "mwparserfromhell>=0.6",
]
# Phase 6 anime subtitle index. Text subs extract with ffmpeg; DBZ/Super ship
# only PGS bitmap subs -> OCR'd with Tesseract (a system install) via pgsrip.
subs = [
    "pgsrip>=0.1.11",
    "static-ffmpeg>=2.5",
]
# Hybrid semantic search over the subtitle index (assembler/roughcut/embeddings.py).
# numpy/tokenizers/huggingface-hub are currently satisfied transitively by
# faster-whisper's own deps on this box, but embeddings.py imports them
# directly - declare them so a future dependency bump can't silently drop one
# out from under it. onnxruntime-gpu (not plain onnxruntime - the two packages
# are mutually exclusive) so CUDAExecutionProvider is available on a box with
# an NVIDIA GPU; it still carries CPUExecutionProvider and falls back cleanly
# on a box without one.
semantic = [
    "numpy>=1.24",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "onnxruntime-gpu>=1.16",
]

[project.scripts]
assembler = "assembler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assembler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
