[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rough-cut-assembler"
version = "0.1.0"
description = "Rough-cut assembler pipeline for the Dragon Ball videos: transcribe the VO, align it to the script, seed beats, build a timed timeline (manga/render/anime pages), and export. Package/command: `roughcut` (through 2026-09-05 it was `assembler`, kept from the original `gfx-orchestrator` tool)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    # The pipeline reads the Dragon Ball database over the `dragonball_db`
    # package (config, portraits, the cbr chapter helpers, and the subs / vision /
    # embeddings / query_compiler indexes). dragonball_db is a SEPARATE repo
    # (dragon_ball_database) - install it (editable) first; it is not on PyPI.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Transcribe the VO + align it to the script. faster-whisper bundles its own
# ffmpeg (PyAV); static-ffmpeg ships the ffmpeg/ffprobe binaries used by subs/vision.
roughcut = [
    "faster-whisper>=1.0",
    "static-ffmpeg>=2.5",
    "opentimelineio>=0.18",          # Phase 5: emit .otio / FCPXML / EDL for the edit
    "otio-fcpx-xml-adapter>=1.0",
    "otio-cmx3600-adapter>=1.0",
]
# Anime subtitle index (roughcut --subs). Text subs extract with ffmpeg; DBZ/Super
# ship only PGS bitmap subs -> OCR'd with Tesseract (a system install) via pgsrip.
subs = [
    "pgsrip>=0.1.11",
    "static-ffmpeg>=2.5",
]
# Hybrid semantic search over the subtitle index (roughcut --subs --semantic-only).
# numpy/tokenizers/huggingface-hub are satisfied transitively by faster-whisper's
# own deps on the dev box, but declared so a future bump can't silently drop one
# out from under embeddings.py. onnxruntime-gpu (not plain onnxruntime - the two
# packages are mutually exclusive) so CUDAExecutionProvider is available on an
# NVIDIA GPU; it still carries CPUExecutionProvider and falls back cleanly off one.
semantic = [
    "numpy>=1.24",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "onnxruntime-gpu>=1.16",
]
# Anime/manga/guidebook vision index (roughcut --vision). PySceneDetect for
# shot-boundary detection; opencv-python comes along as its own dependency.
# nvidia-cudnn-cu12 is needed ON TOP of onnxruntime-gpu for the WD-tagger's ViT
# backbone (a Conv2d patch-embedding layer): CUDAExecutionProvider needs cuDNN to
# run Conv nodes, which the MiniLM embeddings encoder (no convolutions) never did.
vision = [
    "scenedetect>=0.6",
    "nvidia-cudnn-cu12",
]

[project.scripts]
roughcut = "roughcut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roughcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
