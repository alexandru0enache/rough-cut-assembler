[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragon-ball-database"
version = "0.1.0"
description = "Scrape, link, and serve the Dragon Ball database (wiki corpus, vision index, adaptation map, entity links, race traits, subtitle index) over an API. Package/command: `dragonball_db` / `dragonball` (was `assembler`)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Rough-cut assembler: transcribe the VO + align it to the script.
# See docs/plans/video-assembler/. faster-whisper bundles its own ffmpeg (PyAV).
roughcut = [
    "faster-whisper>=1.0",
    "static-ffmpeg>=2.5",
    "opentimelineio>=0.18",          # Phase 5: emit .otio / FCPXML / EDL for the edit
    "otio-fcpx-xml-adapter>=1.0",
    "otio-cmx3600-adapter>=1.0",
]
# Local research corpus: Fandom XML dump -> SQLite FTS5 (assembler wiki build/query).
research = [
    "mwxml>=0.3",
    "mwparserfromhell>=0.6",
]
# Phase 6 anime subtitle index. Text subs extract with ffmpeg; DBZ/Super ship
# only PGS bitmap subs -> OCR'd with Tesseract (a system install) via pgsrip.
subs = [
    "pgsrip>=0.1.11",
    "static-ffmpeg>=2.5",
]
# Hybrid semantic search over the subtitle index (assembler/roughcut/embeddings.py).
# numpy/tokenizers/huggingface-hub are currently satisfied transitively by
# faster-whisper's own deps on this box, but embeddings.py imports them
# directly - declare them so a future dependency bump can't silently drop one
# out from under it. onnxruntime-gpu (not plain onnxruntime - the two packages
# are mutually exclusive) so CUDAExecutionProvider is available on a box with
# an NVIDIA GPU; it still carries CPUExecutionProvider and falls back cleanly
# on a box without one.
semantic = [
    "numpy>=1.24",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "onnxruntime-gpu>=1.16",
]
# Anime/manga/guidebook vision index (docs/plans/anime-vision-index/).
# PySceneDetect for shot-boundary detection; opencv-python comes along as its
# own dependency (0.7.1 dropped the separate [opencv] extra this plan
# originally specced - confirmed 2026-09-06). WD-tagger reuses the `semantic`
# extra's onnxruntime-gpu/huggingface-hub. nvidia-cudnn-cu12 is needed ON TOP
# of onnxruntime-gpu specifically for this extra: WD-tagger's ViT backbone
# has a Conv2d patch-embedding layer, and CUDAExecutionProvider needs cuDNN
# to run Conv nodes - unlike embeddings.py's MiniLM (a BERT-style encoder
# with no convolutions), which never touches cuDNN and worked without it.
# Confirmed 2026-09-06: the base CUDA Toolkit does NOT include cuDNN: without
# this the tagger fails at inference with "cuDNN is unavailable" ("Invalid
# handle. Cannot load symbol cudnnCreate" if the DLLs are found but wired
# wrong - vision_tagger.py's _register_cudnn_dll_dirs() prepends PATH with
# these wheels' bin/ dirs, since os.add_dll_directory() alone isn't enough).
vision = [
    "scenedetect>=0.6",
    "nvidia-cudnn-cu12",
]

[project.scripts]
dragonball = "dragonball_db.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dragonball_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
